[device]
make=realme
model=GT Neo5

# Main camera: Sony IMX890 (qtech module, AK7377 VCM). 16:9 pair so preview
# and photo have the same framing: 1296x736 is the 4x4 binned mode, 4096x2304
# the 2x2 binned one.
# Matrices: forwardmatrix = sRGB->XYZ(D50) x stock CCM (6000 K), colormatrix
# its D65 inverse. Lens: stock 5.59 mm (24 mm equivalent), f/1.88.
[main]
driver=imx890 3-0010
media-driver=qcom-camss
libcamera-id=/base/soc@0/cci@ac15000/i2c-bus@0/camera@10
capture-width=4096
capture-height=2304
capture-rate=30
capture-fmt=RGGB10P
preview-width=1296
preview-height=736
preview-rate=30
preview-fmt=RGGB10P
rotate=270
colormatrix=2.054521, -0.531497, -0.386902, -0.249328, 1.319316, -0.075625, 0.053176, 0.312974, 0.584557
forwardmatrix=0.522288, 0.161146, 0.280784, 0.103017, 0.759682, 0.137300, -0.072234, -0.302306, 1.199743
mirrored=false
blacklevel=0.0626
fov=84.0
fnumber=1.88
focallength=5.59
cropfactor=4.29
iso-min=100
iso-max=1600

# Ultra wide: Sony IMX355, fixed focus. 4:3 binned preview, full capture.
# Lens: stock 1.68 mm (16 mm equivalent), f/2.2.
[wide]
driver=imx355 4-001a
media-driver=qcom-camss
libcamera-id=/base/soc@0/cci@ac15000/i2c-bus@1/camera@1a
capture-width=3280
capture-height=2464
capture-rate=30
capture-fmt=RGGB10P
preview-width=1640
preview-height=1232
preview-rate=30
preview-fmt=RGGB10P
rotate=270
colormatrix=1.494261, -0.072121, -0.319731, -0.654726, 1.565131, 0.052503, -0.384251, 0.653901, 0.653277
forwardmatrix=0.744402, -0.073707, 0.293523, 0.308895, 0.615480, 0.075618, 0.091492, -0.502773, 1.236497
mirrored=false
blacklevel=0.0626
fov=107.0
fnumber=2.2
focallength=1.68
cropfactor=9.52
iso-min=100
iso-max=1600

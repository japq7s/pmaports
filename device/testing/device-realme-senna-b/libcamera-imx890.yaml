# SPDX-License-Identifier: CC0-1.0
# Soft-IPA tuning for the realme GT Neo5 (senna) main Sony IMX890.
# Black level: 64 DN @ 10 bit (measured on raw frames), 64 << 6 = 4096 @ 16 bit.
# CCMs: from the stock cc13 tables in com.qti.tuned.imx890_{sunny,qtech}_main.bin
# (identical in both modules); the colour temperature assigned to each matrix
# is approximate.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2600
          ccm: [ 1.65205, -0.73422, 0.08231,
                 -0.23923, 1.34411, -0.10488,
                 -0.01204, -0.86923, 1.88127 ]
        - ct: 3600
          ccm: [ 1.50854, -0.57288, 0.06434,
                 -0.30862, 1.28111, 0.02750,
                 -0.02207, -0.75600, 1.77807 ]
        - ct: 4500
          ccm: [ 1.50858, -0.42364, -0.08494,
                 -0.32570, 1.24855, 0.07715,
                 -0.13653, -0.62706, 1.76359 ]
        - ct: 6000
          ccm: [ 1.50565, -0.57498, 0.06933,
                 -0.31622, 1.28782, 0.02840,
                 -0.08752, -0.58718, 1.67469 ]
  - Adjust:
  - Agc:
...

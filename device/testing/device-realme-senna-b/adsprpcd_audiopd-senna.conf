[Service]
# Shared objects the ADSP audio PD loads over FastRPC (firmware-realme-senna-b)
Environment=ADSP_LIBRARY_PATH=/usr/lib/rfsa/adsp
# The ADSP FastRPC context banks are not cache coherent with the buffers
# libadsprpc takes from /dev/dma_heap/system (cached, never synced), which
# corrupts the listener's data. Without the heap it allocates them with
# FASTRPC_IOCTL_ALLOC_DMA_BUFF instead.
# TODO: may be unneeded since the ADSP compute CBs are dma-coherent in DT.
InaccessiblePaths=-/dev/dma_heap

# PipeWire on AudioReach PAL (audioreach-pipewire-plugin) for the realme
# GT Neo5 (senna): the card that callaudiod switches to "Voice Call", the
# loudspeaker sink and the handset microphone attached to it.
# nofail: sessions without access to the audio nodes (greeter) still start.
context.modules = [
    {   name = libpipewire-module-pal
        args = {
            pal.card = true
            device.name = "pal-card"
            device.description = "AudioReach"
            # in-call (voice RX) volume until changed with the volume keys, 0..1
            voice.volume = 0.3
        }
        flags = [ nofail ]
    }
    {   name = libpipewire-module-pal
        args = {
            node.name = "pal_sink_speaker_ll"
            node.description = "Speaker"
            node.virtual = false
            media.class = "Audio/Sink"
            # PAL_STREAM_LOW_LATENCY, 10 ms PAL buffers (5 ms ran slower
            # than real time with PulseAudio)
            media.role = "notification"
            pal.buffer.duration-ms = 10
            pal.card.device = 0
            stream.props = {
                audio.position = [ FL FR ]
                priority.session = 1000
                priority.driver = 1000
            }
        }
        flags = [ nofail ]
    }
    {   name = libpipewire-module-pal
        args = {
            node.name = "pal_source_handset_mic"
            node.description = "Microphone"
            node.virtual = false
            media.class = "Audio/Source"
            pal.card.device = 1
            stream.props = {
                audio.position = [ MONO ]
                priority.session = 1000
                priority.driver = 1000
            }
        }
        flags = [ nofail ]
    }
]

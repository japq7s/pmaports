Version = 1;
Make: "realme";
Model: "GT Neo5";

// Main camera: Sony IMX890 (2x2 binned modes) on CSIPHY3 in C-PHY mode.
// Lens from the stock camera config: 5.59 mm (24 mm equivalent), f/1.88.
Rear: {
    SensorDriver: "imx890";
    BridgeDriver: "qcom-camss";
    FlashPath: "/sys/class/leds/white:flash";

    Modes: (
        {
            Width: 4096;
            Height: 3072;
            Rate: 30;
            Format: "RGGB10P";
            Rotate: 270;
            FocalLength: 5.59;
            FNumber: 1.88;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy3", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "imx890"},
                {Type: "Mode", Entity: "msm_csiphy3"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        },
        {
            Width: 4096;
            Height: 2304;
            Rate: 30;
            Format: "RGGB10P";
            Rotate: 270;
            FocalLength: 5.59;
            FNumber: 1.88;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy3", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "imx890"},
                {Type: "Mode", Entity: "msm_csiphy3"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};

// Ultra wide: Sony IMX355 on CSIPHY1, fixed focus.
// Lens from the stock camera config: 1.68 mm (16 mm equivalent), f/2.2.
Wide: {
    SensorDriver: "imx355";
    BridgeDriver: "qcom-camss";
    FlashPath: "/sys/class/leds/white:flash";

    Modes: (
        {
            Width: 3280;
            Height: 2464;
            Rate: 30;
            Format: "RGGB10P";
            Rotate: 270;
            FocalLength: 1.68;
            FNumber: 2.2;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy1", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "imx355"},
                {Type: "Mode", Entity: "msm_csiphy1"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};

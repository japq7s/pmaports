# The AudioReach kernel drivers (audioreach_driver, from the kernel package)
# bind the same DSP services (qcom,q6apm, qcom,q6prm) and the same sound card
# (qcom,sm8450-sndcard) as these upstream ASoC drivers.
blacklist snd_q6apm
blacklist q6apm_dai
blacklist q6apm_lpass_dais
blacklist q6prm
blacklist q6prm_clocks
blacklist snd_soc_sc8280xp

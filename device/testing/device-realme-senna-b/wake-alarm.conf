# PowerDevil needs CAP_WAKE_ALARM for its CLOCK_REALTIME_ALARM timer, without it
# KClock alarms do not wake the phone from suspend (it falls back to
# CLOCK_REALTIME). A file capability does not work: it makes powerdevil a
# secure-exec binary, which then ignores DBUS_SESSION_BUS_ADDRESS.
# Installed for user@.service (so the user manager may grant it) and for
# plasma-powerdevil.service.
[Service]
AmbientCapabilities=CAP_WAKE_ALARM

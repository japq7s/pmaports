; module-pal-card config for realme GT Neo5 (senna), speakers only for now
; (microphones need WCD938x/VA macro on mainline first)
[Global]
default-profile = HiFi

[Port speaker]
description = Speaker
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 200
presence = always
device = PAL_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port earpiece]
description = Earpiece
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 100
presence = always
; module-pal-card's device table has no HANDSET; sink routing only,
; the voice session itself uses PAL_DEVICE_OUT_HANDSET
device = PAL_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port handset-mic]
description = Microphone
default-channel-map = front-center
default-sample-rate = 48000
direction = in
priority = 100
presence = always
device = PAL_DEVICE_IN_HANDSET_MIC

[Profile HiFi]
description = Default pal profile
priority = 500
max-sink-channels = 2
max-source-channels = 1
port-names = speaker earpiece handset-mic

[Sink low-latency0]
description = Speaker (AudioReach)
type = PAL_STREAM_LOW_LATENCY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
encodings = pcm
port-names = speaker earpiece
presence = always
use-hw-volume = false

[Source regular0]
description = Microphone (AudioReach)
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-center
default-buffer-size = 1920
default-buffer-count = 2
port-names = handset-mic
presence = always
use-hw-volume = false

# schedutil runs a CPU at its maximum frequency whenever a real-time task is
# runnable, unless util clamping is in use. The display and GPU kthreads
# (msm atomic/crtc workers, gpu-worker) and PipeWire's data loops are RT and
# wake up every frame, so the A510 and A710 clusters bounced between their
# lowest and highest OPP (12% / 24% of a 30 s idle sample at max; 0% / 9%
# with only the display kthreads switched to SCHED_OTHER). With no minimum
# clamp for RT tasks, their frequency follows their actual load.
# Needs CONFIG_UCLAMP_TASK.
kernel.sched_util_clamp_min_rt_default = 0

# The senna modem rarely survives its first boot: it hits "DOG detects
# stalled initialization" after 40 s and only comes up after one or more
# restarts, i.e. 50 s to several minutes after boot. The upstream unit is
# Type=notify and ordered before ModemManager, so ModemManager's start job
# waits for it all that time. Every D-Bus call to ModemManager blocks on that
# job until the 25 s D-Bus timeout, which freezes Plasma Mobile.
#
# Report the unit as started right away and keep retrying in the background
# until the modem answers. The UIM selection re-activates the provisioning
# session, so restart ModemManager afterwards if it already probed the modem,
# but only once the modem reports the session again: restarted right away it
# found none ("GW primary session index unknown") and gave up with sim-missing.
[Service]
Type=exec
NotifyAccess=all
ExecStart=
ExecStart=/bin/sh -c 'for i in $(seq 40); do if /usr/libexec/msm-modem-uim-selection; then for j in $(seq 30); do qmicli --silent -pd qrtr://0 --uim-get-card-status 2>/dev/null | grep -q "Primary GW: *slot" && break; sleep 1; done; systemctl --no-block try-restart ModemManager.service; exit 0; fi; sleep 3; done; exit 1'
